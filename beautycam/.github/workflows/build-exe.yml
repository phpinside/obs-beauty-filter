name: build-exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python pyvirtualcam pyinstaller

      - name: 算法自测（不通过直接失败）
        run: python src/run.py --selftest --out artifacts

      - name: 生成图标
        run: python tools/make_icon.py

      - name: 打包 exe
        run: python build.py

      - name: 组装分发目录
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item -Recurse dist/BeautyCam release/BeautyCam
          Copy-Item install.bat, uninstall.bat, README.md release/
          Compress-Archive -Path release/* -DestinationPath BeautyCam-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: BeautyCam-win64
          path: |
            BeautyCam-win64.zip
            artifacts/selftest_compare.png
            artifacts/selftest_metrics.json
