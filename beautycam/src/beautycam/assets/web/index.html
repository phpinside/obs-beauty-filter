<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeautyCam 美颜摄像头</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1b1f24; --ink2:#5b6470; --line:#e5e8ec;
    --accent:#ff7fa8; --accent2:#ffbe78; --ok:#12a05c; --off:#98a1ac;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.6 -apple-system,'Segoe UI','Microsoft YaHei',sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:22px 18px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .logo{width:42px;height:42px;border-radius:12px;
    background:linear-gradient(150deg,var(--accent),var(--accent2));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:20px;box-shadow:0 4px 12px rgba(255,127,168,.35)}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .sub{font-size:12px;color:var(--ink2)}
  .pill{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;
    background:#eef1f4;color:var(--off);font-weight:600}
  .pill.on{background:#e6f7ee;color:var(--ok)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--ink2);font-weight:650;
    letter-spacing:.6px;text-transform:uppercase}
  .row{display:flex;align-items:center;gap:8px;margin:8px 0}
  .row label{min-width:44px;font-size:13px;color:var(--ink)}
  input[type=range]{-webkit-appearance:none;flex:1;height:4px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#fff;border:2px solid var(--accent);
    box-shadow:0 1px 4px rgba(0,0,0,.18);cursor:pointer}
  .val{width:38px;text-align:right;font-variant-numeric:tabular-nums;
    font-size:12px;color:var(--ink2)}
  select{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;
    background:#fbfcfd;font-size:13px;color:var(--ink)}
  button{padding:7px 14px;border-radius:9px;border:1px solid var(--line);
    background:#fff;font-size:13px;cursor:pointer;color:var(--ink)}
  button:hover{background:#f7f8fa}
  button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;color:#fff;font-weight:650;box-shadow:0 3px 10px rgba(255,127,168,.35)}
  button.primary.stop{background:#4b5563;box-shadow:none}
  .switch{display:flex;align-items:center;justify-content:space-between;
    padding:6px 0;font-size:13px}
  .toggle{position:relative;width:40px;height:22px;flex:none}
  .toggle input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#d7dbe1;border-radius:999px;
    transition:.18s;cursor:pointer}
  .slider::before{content:"";position:absolute;width:18px;height:18px;left:2px;top:2px;
    background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle input:checked + .slider{background:linear-gradient(135deg,var(--accent),var(--accent2))}
  .toggle input:checked + .slider::before{transform:translateX(18px)}
  .stats{display:flex;gap:16px;font-size:12px;color:var(--ink2);
    border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
  .stats b{color:var(--ink);font-variant-numeric:tabular-nums}
  .hint{font-size:12px;color:var(--ink2);background:#fff8f2;border:1px solid #ffe6d2;
    border-radius:10px;padding:10px 12px;margin-top:4px}
  .hint b{color:#b35b00}
  .btns{display:flex;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✦</div>
    <div>
      <h1>BeautyCam 美颜摄像头</h1>
      <div class="sub">OpenCV 自研算法 · 输出到 OBS 虚拟摄像头</div>
    </div>
    <div id="pill" class="pill">已停止</div>
  </header>

  <div class="card">
    <h2>视频源</h2>
    <div class="row"><label>摄像头</label>
      <select id="cam"></select>
      <button id="refresh">刷新</button>
    </div>
    <div class="row"><label>分辨率</label>
      <select id="res">
        <option>1280x720</option><option>1920x1080</option>
        <option>960x540</option><option>640x480</option>
      </select>
      <select id="fps" style="max-width:88px">
        <option>30</option><option>25</option><option>60</option><option>15</option>
      </select>
    </div>
  </div>

  <div class="card">
    <h2>美颜强度</h2>
    <div id="sliders"></div>
  </div>

  <div class="card">
    <h2>选项</h2>
    <div id="switches"></div>
    <div class="stats">
      <span>帧率 <b id="fpsNow">—</b></span>
      <span>单帧 <b id="msNow">—</b></span>
      <span>虚拟摄像头 <b id="vcamNow">—</b></span>
    </div>
  </div>

  <div class="btns" style="margin-bottom:12px">
    <button id="toggle" class="primary" style="flex:1">开始</button>
    <button id="save">保存配置</button>
    <button id="reset">恢复默认</button>
  </div>

  <div class="hint">
    在 OBS 里添加 <b>视频采集设备</b> → 设备选 <b>OBS Virtual Camera</b>，就能拿到这里的画面。
    想画中画微调，可以同时挂 OBS 的「美颜滤镜」插件。
  </div>
</div>

<script>
const SLIDERS = [
  ["smooth","磨皮",0,1], ["whiten","美白",0,1], ["rosy","红润",0,1],
  ["sharpen","锐化",0,1], ["slim","瘦脸",-0.6,0.6], ["eye","大眼",0,1],
];
const SWITCHES = [
  ["enabled","启用美颜"], ["auto_face","自动人脸定位"], ["mirror","镜像画面"],
  ["show_preview","显示预览窗口"], ["virtual_cam","输出到 OBS 虚拟摄像头"],
  ["fast","性能模式（3/4 分辨率渲染）"],
];
let state = null, sendTimer = null;

function el(tag, cls, txt){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt; return e; }

function buildUI(){
  const box = document.getElementById("sliders");
  SLIDERS.forEach(([key,label,lo,hi])=>{
    const row = el("div","row");
    row.appendChild(el("label",null,label));
    const inp = document.createElement("input");
    inp.type="range"; inp.min=lo; inp.max=hi; inp.step=0.01; inp.id="s_"+key;
    const val = el("span","val","0.00"); val.id="v_"+key;
    inp.addEventListener("input",()=>{ val.textContent = Number(inp.value).toFixed(2); push(); });
    row.appendChild(inp); row.appendChild(val); box.appendChild(row);
  });
  const sw = document.getElementById("switches");
  SWITCHES.forEach(([key,label])=>{
    const row = el("div","switch");
    row.appendChild(el("span",null,label));
    const t = el("label","toggle");
    const i = document.createElement("input"); i.type="checkbox"; i.id="c_"+key;
    i.addEventListener("change",push);
    t.appendChild(i); t.appendChild(el("span","slider")); row.appendChild(t);
    sw.appendChild(row);
  });
}

function applyState(s){
  state = s;
  const b = s.beauty;
  SLIDERS.forEach(([key])=>{ const i=document.getElementById("s_"+key);
    if(document.activeElement!==i){ i.value = b[key]; document.getElementById("v_"+key).textContent = Number(b[key]).toFixed(2);} });
  document.getElementById("c_enabled").checked = b.enabled;
  document.getElementById("c_auto_face").checked = b.auto_face;
  document.getElementById("c_mirror").checked = s.mirror;
  document.getElementById("c_show_preview").checked = s.show_preview;
  document.getElementById("c_virtual_cam").checked = s.virtual_cam;
  document.getElementById("c_fast").checked = b.process_scale < 0.99;
  document.getElementById("res").value = s.width+"x"+s.height;
  document.getElementById("fps").value = String(s.fps);
  fillCams(s.devices, s.camera_index);
  setRunning(s.running);
}

function fillCams(devices, cur){
  const sel = document.getElementById("cam");
  sel.innerHTML = "";
  if(!devices.length){ sel.appendChild(new Option("（未检测到摄像头）", "-1")); return; }
  devices.forEach(([idx,name])=>{ const o=new Option(name, idx); if(idx===cur) o.selected=true; sel.appendChild(o); });
}

function setRunning(on){
  const pill=document.getElementById("pill"), btn=document.getElementById("toggle");
  pill.textContent = on ? "运行中" : "已停止";
  pill.className = "pill" + (on ? " on" : "");
  btn.textContent = on ? "停止" : "开始";
  btn.classList.toggle("stop", on);
}

function collect(){
  const b = {};
  SLIDERS.forEach(([key])=>{ b[key] = Number(document.getElementById("s_"+key).value); });
  b.enabled = document.getElementById("c_enabled").checked;
  b.auto_face = document.getElementById("c_auto_face").checked;
  b.process_scale = document.getElementById("c_fast").checked ? 0.75 : 1.0;
  const [w,h] = document.getElementById("res").value.split("x").map(Number);
  return {beauty:b, mirror:document.getElementById("c_mirror").checked,
          show_preview:document.getElementById("c_show_preview").checked,
          virtual_cam:document.getElementById("c_virtual_cam").checked,
          width:w, height:h, fps:Number(document.getElementById("fps").value),
          camera_index:Number(document.getElementById("cam").value)};
}

function push(){
  clearTimeout(sendTimer);
  sendTimer = setTimeout(()=>{
    fetch("/api/params",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(collect())}).catch(()=>{});
  }, 90);
}

async function post(url, body){
  const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body||{})});
  return r.json();
}

async function poll(){
  try{
    const r = await fetch("/api/stats"); const s = await r.json();
    document.getElementById("fpsNow").textContent = s.running ? s.fps.toFixed(1) : "—";
    document.getElementById("msNow").textContent = s.running ? s.ms.toFixed(1)+" ms" : "—";
    document.getElementById("vcamNow").textContent = s.vcam || "—";
    if(s.running !== (document.getElementById("pill").className.includes("on"))) setRunning(s.running);
    if(s.error){ document.getElementById("pill").textContent = "错误"; }
  }catch(e){}
}

document.getElementById("toggle").addEventListener("click", async ()=>{
  const on = document.getElementById("pill").className.includes("on");
  await fetch("/api/params",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(collect())});
  const s = await post("/api/control", {action: on ? "stop" : "start"});
  setRunning(s.running);
});
document.getElementById("refresh").addEventListener("click", async ()=>{
  const s = await post("/api/devices", {}); fillCams(s.devices, s.camera_index);
});
document.getElementById("save").addEventListener("click", async ()=>{
  await post("/api/save", {}); alert("配置已保存，下次启动自动生效。");
});
document.getElementById("reset").addEventListener("click", async ()=>{
  const s = await post("/api/reset", {}); applyState(s);
});

buildUI();
fetch("/api/state").then(r=>r.json()).then(applyState);
setInterval(poll, 600);
</script>
</body>
</html>
