name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: 取插件源码
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: 取 OBS 源码（只用于拿到 libobs 头文件与导入库）
        run: |
          git clone --depth 1 --branch 30.2.3 https://github.com/obsproject/obs-studio.git obs
          Copy-Item -Recurse -Force plugin obs/plugins/obs-beauty-filter
          Add-Content -Path obs/plugins/CMakeLists.txt -Value "`nadd_subdirectory(obs-beauty-filter)"

      - name: 配置（关掉 UI / 浏览器 / 脚本，只留 libobs）
        run: |
          cmake -S obs -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_UI=OFF -DENABLE_QT=OFF -DENABLE_BROWSER=OFF `
            -DENABLE_VLC=OFF -DENABLE_SCRIPTING=OFF -DENABLE_VIRTUALCAM=OFF `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: 编译插件
        run: cmake --build build --config RelWithDebInfo --target obs-beauty-filter

      - name: 安装到 dist 目录（得到 OBS 目录结构）
        run: cmake --install build --config RelWithDebInfo --prefix dist

      - name: 打包
        run: Compress-Archive -Path dist/* -DestinationPath obs-beauty-filter-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: obs-beauty-filter-win64
          path: obs-beauty-filter-win64.zip
